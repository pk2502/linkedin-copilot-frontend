name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      # Only the build needs the production API URL; tests expect the
      # localhost default.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://connectpilot-api.onrender.com
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Informational until the existing lint problems are fixed (Phase 5).
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint
